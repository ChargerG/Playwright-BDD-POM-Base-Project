name: Playwright BDD Tests

on:
  push:
    branches: [ master-tiger ]
  pull_request:
    branches: [ master-tiger ]
  workflow_dispatch:
    inputs:
      country:
        description: 'Selecciona el País (COUNTRY)'
        required: true
        default: 'CO'
        type: choice
        options:
          - CO
          - MX
          - CL
      retries:
        description: 'Número de reintentos (RETRIES)'
        required: true
        default: '1'
      workers:
        description: 'Número de workers en paralelo'
        required: true
        default: '1'
      # NUEVO: Input para que puedas cambiar el Tag/Etiqueta desde GitHub si quieres
      tag:
        description: 'Tag del escenario a ejecutar (ej. @RCA-T11111)'
        required: true
        default: '@RCA-T11111'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "COUNTRY=${{ github.event.inputs.country || 'CO' }}" >> .env
        echo "RETRIES=${{ github.event.inputs.retries || '1' }}" >> .env
        echo "WORKERS=${{ github.event.inputs.workers || '1' }}" >> .env

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # MODIFICADO: Ahora pasamos el parámetro del tag dinámicamente usando el doble guion (--)
    - name: Run Playwright BDD tests
      run: npm test -- ${{ github.event.inputs.tag || '@RCA-T11111' }}

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
